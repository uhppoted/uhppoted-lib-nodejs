name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.22.3, 23.11.1, 24.16.0, 25.9.0, 26.3.0]

    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Check out code
      uses: actions/checkout@v7

    - name: Install eslint
      run: npm install eslint prettier --save-dev

    - name: Build and test
      run: |
        npm ci
        npm run build --if-present
        npm test
