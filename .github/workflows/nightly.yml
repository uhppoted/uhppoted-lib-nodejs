name: nightly

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.22.3, 23.11.1, 24.16.0, 25.9.0, 26.3.0]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
    - run: npm pack

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        path: uhppoted-0.9.1.tgz
        name: uhppoted-0.9.1-alpha-${{ matrix.node-version }}.tgz
